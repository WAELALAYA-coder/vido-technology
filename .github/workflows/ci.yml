name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check backend/server.js
          node --check questions-v37.js
          node --check lessons-v37.js
          node --check scripts/audit.mjs
          node --check scripts/smoke-assets.mjs

      - name: Run application audit
        run: npm test

      - name: Smoke-test public learning assets and private paths
        run: node scripts/smoke-assets.mjs

      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Build production container image
        run: docker build --tag vido-technology-ci .
