name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check backend/server.js
          node --check questions-v37.js
          node --check lessons-v37.js
          node --check diagram-curriculum-v38.js
          node --check diagram-engine-v38.js
          node --check diagram-trainer.js
          node --check scripts/diagram-audit.mjs
          node --check scripts/audit.mjs
          node --check scripts/smoke-assets.mjs

      - name: Run application audit
        run: npm test

      - name: Smoke-test public learning assets and private paths
        run: node scripts/smoke-assets.mjs

      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Build production container image
        run: docker build --tag vido-technology-ci .
