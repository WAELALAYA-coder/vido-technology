services:
  postgres:
    image: postgres:16-alpine
    container_name: vido-postgres-v39
    restart: unless-stopped
    environment:
      POSTGRES_DB: vido
      POSTGRES_USER: vido_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - vido_pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vido_user -d vido"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5433:5432"
  app:
    image: node:22-alpine
    container_name: vido-app-v39
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      VIDO_REQUIRE_STRONG_CREDENTIALS: "true"
      PORT: 3000
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      DATABASE_URL: postgresql://vido_user:${POSTGRES_PASSWORD}@postgres:5432/vido
      JWT_SECRET: ${JWT_SECRET}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - .:/app
      - vido_node_modules:/app/node_modules
    command: sh -c "npm install --omit=dev && npm run server"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  vido_pgdata:
    external: true
    name: vido_technology_v39_pgdata
  vido_node_modules:
    external: true
    name: vido_technology_v39_node_modules
